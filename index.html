<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>2027年踏入大洋洲(NZ)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 藍染和紙旅行手帳 — 手機單欄；每日頁 = 標題 → 手繪地圖 → 時間軸 */
:root{
  --paper:#F3F2EC; --card:#FBFAF6; --ink:#1F2A3A; --ink-soft:#5B6472; --line:#E2DFD4;
  --accent:#2E4A6B; --accent-soft:#E4E9F0; --on-accent:#FBFAF6;
  --stamp:#C8452D; --stamp-soft:#F8ECE7;
  --adult:#4E7A55; --adult-soft:#E3EDE4; --kfam:#A8730F; --kfam-soft:#F6EAD0;
  --map-land:#EFEDE4; --map-sea:#D6E0E8; --map-water:#B6CADB; --map-coast:#8C9DB0; --map-mtn:#E2E0D6; --map-ink:#4F5B6B; --map-park:#DCE6D2;
  --wash-sky:#E8EDF2; --wash-lake:#CEDBE7; --wash-grass:#EADFB8; --kiwi:#8A6A4A;
  --font-display:"Zen Maru Gothic","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141A22; --card:#1C2430; --ink:#E6E9EE; --ink-soft:#9AA4B2; --line:#2C3644;
  --accent:#8FB0D6; --accent-soft:#22324A; --on-accent:#141A22;
  --stamp:#EC7A62; --stamp-soft:#36231F;
  --adult:#8CC195; --adult-soft:#22352A; --kfam:#E2B455; --kfam-soft:#3A301C;
  --map-land:#222B36; --map-sea:#18222E; --map-water:#2E4866; --map-coast:#4A5A6E; --map-mtn:#2E3846; --map-ink:#AEB8C6; --map-park:#263526;
  --wash-sky:#1B2430; --wash-lake:#243A52; --wash-grass:#3A3524; --kiwi:#B8956E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141A22; --card:#1C2430; --ink:#E6E9EE; --ink-soft:#9AA4B2; --line:#2C3644;
  --accent:#8FB0D6; --accent-soft:#22324A; --on-accent:#141A22;
  --stamp:#EC7A62; --stamp-soft:#36231F;
  --adult:#8CC195; --adult-soft:#22352A; --kfam:#E2B455; --kfam-soft:#3A301C;
  --map-land:#222B36; --map-sea:#18222E; --map-water:#2E4866; --map-coast:#4A5A6E; --map-mtn:#2E3846; --map-ink:#AEB8C6; --map-park:#263526;
  --wash-sky:#1B2430; --wash-lake:#243A52; --wash-grass:#3A3524; --kiwi:#B8956E;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:500;font-size:15px;white-space:nowrap}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.view{padding-block:16px 48px}

/* 首頁 */
.hero{border-radius:var(--r);overflow:hidden;line-height:0;margin-top:4px;border:1px solid var(--line);background:var(--card)}
.hero svg{width:100%;height:auto;display:block}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--ink-soft);margin:18px 0 4px}
.home-title{font-size:clamp(26px,7.4vw,34px);line-height:1.25}
.who{color:var(--ink-soft);margin:8px 0 0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-family:var(--font-display);font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--accent)}
.fact span{font-size:12px;color:var(--ink-soft)}
.sec-h{font-size:18px;margin:26px 0 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.sec-h small{font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--ink-soft)}

/* 地圖 */
.map{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;margin:14px 0 0}
.map svg{width:100%;height:auto;display:block;border-radius:10px}
.map-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 4px 2px}
.map-note{font-size:12px;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-size:14px;font-weight:500;border:0;cursor:pointer}
.btn svg{width:16px;height:16px}
.legend{list-style:none;margin:6px 0 0;padding:8px 4px 2px;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;border-top:1px dashed var(--line);font-size:13px}
.legend li{display:flex;gap:6px;align-items:baseline;min-width:0}
.legend li span:last-child{min-width:0;overflow-wrap:anywhere;line-height:1.4}
.dot{flex:0 0 auto;display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.dot.g-adult{background:var(--adult)} .dot.g-kfam{background:var(--kfam)} .dot.stay{background:var(--ink);color:var(--paper)}

/* 天數卡片 */
.days{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.day-card{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:inherit}
.day-card .d{font-family:var(--font-display);text-align:center;line-height:1.15;color:var(--accent)}
.day-card .d b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.day-card .d span{font-size:11px;color:var(--ink-soft)}
.day-card .th{font-weight:500;min-width:0}
.day-card .th small{display:block;color:var(--ink-soft);font-weight:400;font-size:12px}
.day-card .n{font-size:12px;color:var(--ink-soft)}
.split-mark{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--kfam-soft);color:var(--kfam);margin-left:4px;font-weight:500}

/* 每日頁 */
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px 10px}
.strip::-webkit-scrollbar{display:none}
.strip a{flex:0 0 auto;text-align:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 9px;font-size:12px;line-height:1.3;font-variant-numeric:tabular-nums}
.strip a b{display:block;font-family:var(--font-display);font-size:15px}
.strip a[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;margin:4px 0 0}
.seg button{border:0;background:none;border-radius:999px;padding:7px 4px;font-weight:500;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button[data-v="adult"][aria-pressed="true"]{background:var(--adult);color:var(--card)}
.seg button[data-v="kfam"][aria-pressed="true"]{background:var(--kfam);color:var(--card)}
.day-meta{font-size:14px;color:var(--ink-soft);margin:16px 0 2px}
.day-title{font-size:clamp(24px,6.6vw,30px);line-height:1.3}
.tonight{margin:8px 0 0;font-size:15px}
.tonight a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
.today-drive{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.today-drive svg{width:16px;height:16px}

.tl{list-style:none;margin:20px 0 0;padding:0}
.it{position:relative;display:grid;grid-template-columns:58px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.tl > .it:first-child{border-top:0}
.move + .it{border-top:0}
.it .t{font-family:var(--font-display);font-size:14px;line-height:1.35;color:var(--ink-soft);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.it .t .tag{display:block;font-family:var(--font-body);font-size:11px}
.it .body{min-width:0}
.ttl{font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;line-height:1.45}
.ttl .tx{min-width:0;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.g-adult{background:var(--adult-soft);color:var(--adult)}
.chip.g-kfam{background:var(--kfam-soft);color:var(--kfam)}
.chip.opt{background:transparent;border:1px dashed var(--ink-soft);color:var(--ink-soft)}
.chip.stay{background:var(--ink);color:var(--paper)}
.chip.cat{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.it.g-adult .body{border-left:3px solid var(--adult);padding-left:10px}
.it.g-kfam .body{border-left:3px solid var(--kfam);padding-left:10px}
.it.optional .ttl .tx{color:var(--ink-soft)}
.it.booked{background:var(--stamp-soft);border-radius:12px;padding:12px 10px;border-top:0;margin-top:6px}
.it.booked + .it, .it.booked + .move{border-top:0}
.it.booked .ttl,.it.booked .ttl + .note{padding-right:50px}
.stamp{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:2px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:13px;transform:rotate(-12deg);background:var(--card)}
.stamp::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid var(--stamp);opacity:.6}
.note{margin:4px 0 0;font-size:14px;color:var(--ink-soft);white-space:pre-line;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lk{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
.lk svg{width:13px;height:13px;color:var(--accent)}
/* 交通連接條 */
.move{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;padding:2px 0}
.move .rail{justify-self:center;width:0;height:100%;min-height:34px;border-left:2px dashed var(--accent);opacity:.55}
.move .pill{justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:13.5px;font-weight:700}
.move .pill svg{width:18px;height:18px}
.move.bus .pill,.move.walk .pill{background:var(--accent-soft);color:var(--accent)}
/* 細項框 */
.subbox{margin-top:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;overflow:hidden}
.subhead{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);padding:6px 12px}
.subbox ul{list-style:none;margin:0;padding:0}
.subrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:9px 12px;border-top:1px solid var(--line)}
.subrow:first-child{border-top:0}
.subrow .nm{font-weight:500;font-size:14px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.subrow .nm .chip{margin-left:4px;vertical-align:1px}
.subrow .note{font-size:13px;margin-top:2px}
.subrow .bullet{width:20px;height:20px;display:grid;place-items:center}
.subrow .bullet::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.6}
.ic{display:flex;gap:4px}
.ic a{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);color:var(--accent);background:var(--paper)}
.ic svg{width:15px;height:15px}
.backup{margin-top:10px;border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.backup .lab{font-size:12px;color:var(--ink-soft);font-weight:500}
.booking{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.booking h4{margin:0 0 4px;font-size:12px;letter-spacing:.08em;color:var(--stamp);font-weight:700}
.booking ul{margin:0;padding-left:18px}
.flight{margin-top:8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.flight .ap b{display:block;font-family:var(--font-display);font-size:22px;line-height:1.1;color:var(--accent)}
.flight .ap span{font-size:12px;color:var(--ink-soft)}
.flight .ap:last-child{text-align:right}
.flight .mid{font-size:12px;color:var(--ink-soft);text-align:center}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:28px}
.pager a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:inherit;font-size:13px;min-width:0}
.pager a b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager a:last-child{text-align:right}
.empty{color:var(--ink-soft);font-size:14px;padding:16px 0}

/* 其他分頁 */
.cards{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{font-size:17px;line-height:1.35}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0 0;font-size:14px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pass{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end;margin-top:8px}
.pass b{display:block;font-family:var(--font-display);font-size:30px;line-height:1;color:var(--accent)}
.pass .r{text-align:right}
.pass small{display:block;font-size:12px;color:var(--ink-soft)}
.pass .arrow{color:var(--ink-soft);font-size:12px;text-align:center;padding-bottom:4px}
.stay-town{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.check{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.check li:first-child label{border-top:0}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:0 0 auto}
.check input:checked + span{color:var(--ink-soft);text-decoration:line-through}
.check small{display:block;color:var(--ink-soft);text-decoration:none}
.bc{background:#ffffff;border-radius:12px;padding:14px 12px 10px;margin-top:10px;text-align:center;border:1px solid var(--line)}
.bc svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.bc .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;letter-spacing:.12em;color:#111111;margin-top:4px}
.plain{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.foot{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:32px}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

const EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const EAN_P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function ean13Bits(code){
  const d=code.split('').map(Number), p=EAN_P[d[0]];
  let b='101'; for(let i=1;i<=6;i++) b+=(p[i-1]==='L'?EAN_L:EAN_G)[d[i]];
  b+='01010'; for(let i=7;i<=12;i++) b+=EAN_R[d[i]];
  return b+'101';
}
const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128cBits(code){
  const vals=[105]; for(let i=0;i<code.length;i+=2) vals.push(+code.slice(i,i+2));
  let sum=105; for(let i=1;i<vals.length;i++) sum+=vals[i]*i; vals.push(sum%103, 106);
  let b=''; for(const v of vals){const w=C128[v];for(let i=0;i<w.length;i++) b+=(i%2?'0':'1').repeat(+w[i])}
  return b;
}
function barcodeSVG(bits){
  const q=10, W=bits.length+2*q, H=60; let r='';
  for(let i=0;i<bits.length;){ if(bits[i]==='1'){let j=i;while(bits[j]==='1')j++;r+=`<rect x="${i+q}" y="0" width="${j-i}" height="${H}"/>`;i=j}else i++ }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:96px" role="img" aria-label="條碼"><rect width="${W}" height="${H}" fill="#ffffff"/><g fill="#000000">${r}</g></svg>`;
}
const BARCODES=[
  {name:'Everyday Rewards 會員價',where:'Woolworths、FreshChoice 超市；BP、g.a.s. 加油每公升折 6 分',type:'ean13',code:'9490048948807'},
  {name:'Club+ 會員價',where:'New World、PAK\'nSAVE、Four Square 超市；Z、Caltex 與 New World／PAK\'nSAVE 加油站每公升折 8 分',type:'c128',code:'6059174262757453'},
  {name:'Aotea Gifts 紀念品 95 折',where:'奧克蘭、羅托魯瓦、基督城、蒂卡波、皇后鎮分店',type:'ean13',code:'0011000042150'}
];
function barcodeView(){
  const dong=TRIP.dong||[];
  const src=dong.find(x=>x.link&&/drive\.google/.test(x.link));
  const isUrlOnly=x=>!x.text;
  const items=dong.filter(x=>x!==src&&x.text&&!/^這個包含/.test(x.text));
  return `<h1 class="day-title" style="margin-top:6px">冬冬條碼</h1>
  <p class="note">結帳時給店員掃。手機亮度調高，掃不到時可以打開原始檔。</p>
  <div class="cards" style="margin-top:12px">${BARCODES.map(b=>{const bits=b.type==='ean13'?ean13Bits(b.code):code128cBits(b.code);
    return `<article class="card"><h3>${esc(b.name)}</h3><p class="note">${esc(b.where)}</p><div class="bc">${barcodeSVG(bits)}<div class="num">${esc(b.code)}</div></div></article>`}).join('')}</div>
  ${src?`<div class="links" style="margin-top:12px"><a class="lk" href="${esc(src.link)}" target="_blank" rel="noopener">${ICON.link}原始條碼檔（含 BP 加油 QR code）</a></div>`:''}
  <p class="note" style="margin-top:8px">條碼是依號碼重新產生的，出發前請先用手機掃碼 app 測試一次。</p>
  ${items.length?`<h2 class="sec-h">冬冬的推薦與折扣</h2><div class="card"><ul class="plain">${items.map(x=>`<li>${esc(x.text)}${x.link?` <a href="${esc(x.link)}" target="_blank" rel="noopener">連結</a>`:''}</li>`).join('')}</ul></div>`:''}`;
}

/* ------------------ 路由 ------------------ */
function render(){
  const h=location.hash.replace('#','');
  let r='home', html;
  const m=h.match(/^day-(\d+)$/);
  if(m){r='day';html=dayView(+m[1])}
  else if(h==='transport'||h==='flights'){r='transport';html=transportView()}
  else if(h==='stays'){r='stays';html=staysView()}
  else if(h==='list'){r='list';html=listView()}
  else if(h==='barcode'){r='barcode';html=barcodeView()}
  else html=home();
  $app.innerHTML=html;
  document.querySelectorAll('.tab').forEach(a=>{if(a.dataset.r===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const cur=document.querySelector('.strip [aria-current]'); if(cur) cur.scrollIntoView({block:'nearest',inline:'center'});
}
$app.addEventListener('click',e=>{
  const b=e.target.closest('.seg button'); if(!b) return;
  view=b.dataset.v; store.set('view',view); const y=window.scrollY; render(); window.scrollTo(0,y);
});
$app.addEventListener('change',e=>{
  const c=e.target.closest('input[data-id]'); if(!c) return;
  const done=store.get('check',{}); done[c.dataset.id]=c.checked; store.set('check',done);
});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
if(C128.length!==107) console.error('Code128 table length',C128.length);
render();
</script>
